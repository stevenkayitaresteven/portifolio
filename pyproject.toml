[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-explicit-filter"
version = "0.1.0"
description = "Detect and redact explicit content across image, video, audio, and text — with a moderated chat UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["nsfw", "content-moderation", "image-moderation", "nudity-detection",
            "toxicity", "profanity-filter", "computer-vision", "opencv", "onnx",
            "huggingface"]
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
# Box-level nudity detector (offline ONNX model ships in the wheel).
detectors = ["nudenet", "onnxruntime"]
# Hugging Face backends for multimodal moderation: the text moderation
# ensemble (KoalaAI/Text-Moderation + toxic-bert + optional specialists),
# Falconsai NSFW ViT (image), Whisper ASR (audio). Audio formats beyond WAV
# and video soundtracks additionally want the `ffmpeg` binary on PATH.
hf = ["transformers>=4.45", "torch", "pillow"]
# Extra file/upload analysis: PDF text extraction and image OCR (memes,
# screenshots). DOCX extraction needs no extra dep (stdlib zip+XML).
files = ["pypdf", "pytesseract", "pillow"]
# Browser UI + HTTP service + the WhatsApp-style chat UI.
serve = ["fastapi", "uvicorn[standard]", "python-multipart"]
# Fine-tuning the multi-label text classifier and the image classifier.
train = ["torch", "torchvision", "transformers>=4.45", "datasets", "pillow", "onnx"]
# Running the test suite.
test = ["pytest"]

[project.scripts]
# `sentinel ...` is equivalent to `python -m safety ...`
sentinel = "safety.cli:main"

[tool.setuptools]
packages = ["safety", "safety.detectors", "safety.multimodal", "safety.train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
